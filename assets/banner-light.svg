<title id="title">agent-lab: learning by doing, from the 1958 perceptron to multi-agent harnesses</title>
<desc id="desc">Nine chapters and the years their stories span: chapter 1, Where Machine Learning Came From, 1943 to 2023; chapter 2, Linear Models and Gradient Descent, 1801 to 2014; chapter 3, Neural Networks and Autodiff, 1970 to 2022; chapter 4, From CNNs to Transformers, 1959 to 2020; chapter 5, Large Language Models and APIs, 1913 to 2025; chapter 6, The Agent Loop, 1966 to 2025; chapter 7, Harness Engineering, 2024 to 2026; chapter 8, Multi-Agent Collaboration, 1971 to 2025; chapter 9, Cross-Model Collaboration, 1969 to 2026.</desc>
