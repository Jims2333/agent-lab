name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labs:
    name: Labs (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "mcp[cli]>=1.20,<2"   # only side quest 2 needs it (written for the 1.x SDK)

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Run every lab with the mock model (no API keys)
        run: python tools/run_labs.py

  docs:
    name: Links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check every relative link and #anchor in the Markdown files
        run: python tools/check_links.py
